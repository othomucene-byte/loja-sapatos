<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Loja Sapatos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script></head><body class="bg-stone-50 text-stone-900 min-h-screen p-4 sm:p-8" style="font-family:'Inter',sans-serif;"><main class="max-w-xl mx-auto bg-white border border-stone-200 rounded-xl shadow-sm p-6 sm:p-8"><header class="mb-6 border-b border-stone-100 pb-4"><h1 class="text-2xl font-semibold text-stone-900" style="font-family:'Playfair Display',serif;">Loja Sapatos</h1><p class="text-sm text-stone-500 mt-1">Adicionar novo item ao catálogo</p></header><form id="createForm" onsubmit="handleCreateItem(event)" class="space-y-4"><div><label for="newItemTitle" class="block text-sm font-medium text-stone-700 mb-1">Nome do Sapato</label><input id="newItemTitle" type="text" placeholder="Ex: Tênis Couro Urbano" required class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-stone-800"/></div><div><label for="newItemImage" class="block text-sm font-medium text-stone-700 mb-1">Imagem do Produto (URL ou Upload)</label><input id="newItemImage" type="url" placeholder="https://images.unsplash.com/photo-..." class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-stone-800 mb-2" oninput="updateImagePreview(this.value)"/><div class="flex items-center gap-3"><label for="newItemImageFile" class="inline-flex items-center gap-2 px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-medium rounded-lg cursor-pointer transition"><i data-lucide="upload" class="w-4 h-4"></i><span>Escolher arquivo do dispositivo</span></label><input id="newItemImageFile" type="file" accept="image/*" class="hidden" onchange="handleImageFileSelect(event)"/><span id="fileNameLabel" class="text-xs text-stone-500 truncate">Nenhum arquivo selecionado</span></div><div id="imagePreviewContainer" class="hidden mt-3 border border-stone-200 rounded-lg p-2 bg-stone-50"><img id="newItemImagePreview" src="" alt="Pré-visualização do sapato" class="w-full h-44 object-cover rounded-md"/></div></div><div><label for="newItemDesc" class="block text-sm font-medium text-stone-700 mb-1">Descrição Resumida</label><textarea id="newItemDesc" rows="3" placeholder="Descreva material, conforto e estilo..." class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-stone-800"></textarea></div><button type="submit" class="w-full py-2.5 px-4 bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium rounded-lg transition flex items-center justify-center gap-2"><i data-lucide="check" class="w-4 h-4"></i><span>Salvar</span></button></form><section id="itemsList" class="mt-8 space-y-3"></section></main><script>let uploadedImageData = "";function updateImagePreview(url){const container=document.getElementById("imagePreviewContainer");const preview=document.getElementById("newItemImagePreview");if(url&&url.trim()!==""){preview.src=url.trim();container.classList.remove("hidden");}else if(!uploadedImageData){preview.src="";container.classList.add("hidden");}}function handleImageFileSelect(e){const file=e.target.files&&e.target.files[0];const fileLabel=document.getElementById("fileNameLabel");if(!file){return;}fileLabel.textContent=file.name;const reader=new FileReader();reader.onload=function(evt){uploadedImageData=evt.target.result;document.getElementById("newItemImage").value="";updateImagePreview(uploadedImageData);};reader.readAsDataURL(file);}function handleCreateItem(e){if(e&&e.preventDefault){e.preventDefault();}const titleInput=document.getElementById("newItemTitle");const descInput=document.getElementById("newItemDesc");const imageInput=document.getElementById("newItemImage");const selectedImage=(imageInput&&imageInput.value.trim())||uploadedImageData||"https://images.unsplash.com/photo-1542291026-7eec264c27ff";const x={title:(titleInput&&titleInput.value.trim())||"Teste",description:(descInput&&descInput.value.trim())||"",image:selectedImage};renderCreatedItem(x);document.getElementById("createForm").reset();uploadedImageData="";document.getElementById("fileNameLabel").textContent="Nenhum arquivo selecionado";document.getElementById("imagePreviewContainer").classList.add("hidden");document.getElementById("newItemImagePreview").src="";}function renderCreatedItem(item){const list=document.getElementById("itemsList");if(!list)return;const card=document.createElement("article");card.className="flex gap-4 p-3 border border-stone-200 rounded-lg bg-stone-50 items-center";card.innerHTML=`<img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-cover rounded-md border border-stone-200 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff'"><div class="min-w-0"><h3 class="text-sm font-semibold text-stone-900 truncate"></h3><p class="text-xs text-stone-600 mt-0.5 line-clamp-2"></p></div>`;card.querySelector("h3").textContent=item.title;card.querySelector("p").textContent=item.description||"Sem descrição";list.prepend(card);}if(window.lucide){lucide.createIcons();}</script></body></html>
